<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body {
    font-family: Arial, Helvetica, sans-serif;
}

table {
    border-collapse: collapse;
}

td, th {
    border: 1px solid black;
    padding: 10px;
}

td {
    text-align: center;
}

.disciplinas {
    text-align: left;
}

.grey {
    font-weight: bold;
    color: white;
    background-color: grey;
}

</style>

<body>
    <table>
        <tr class="grey">
            <th rowspan="2" scope="col">Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Médias</th>
        </tr>

        <tr class="grey">
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
        </tr>

        <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td class="disciplinas">Matemática</td>
            <td>10.0</td>
            <td>9.0</td>
            <td>9.5</td>
        </tr>

        <tr>
            <td class="disciplinas">Física</td>
            <td>8.0</td>
            <td>9.0</td>
            <td>8.5</td>
        </tr>

        <tr>
            <td class="disciplinas">Química</td>
            <td>7.0</td>
            <td>7.0</td>
            <td>7.0</td>
        </tr>

        <tr>
            <td class="disciplinas">Biologia</td>
            <td>6.0</td>
            <td>7.0</td>
            <td>6.5</td>
        </tr>

        <tr class="grey">
            <th colspan="4" scope="row">Média de Exatas</th>
            <td class="bold">7.9</td>
        </tr>

        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td class="disciplinas">História</td>
            <td>8.0</td>
            <td>7.0</td>
            <td>7.5</td>
        </tr>

        <tr>
            <td class="disciplinas">Geografia</td>
            <td>7.0</td>
            <td>6.5</td>
            <td>6.8</td>
        </tr>

        <tr class="grey">
            <th colspan="4" scope="row">Média de Humanas</th>
            <td>7.1</td>
        </tr>
    </table>
</body>
</html>
