<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=vpn_key" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person" />
</head>
<body>
    <section>
        <picture>
            <source media="(min-width: 992px)" srcset="imagens/imagem-g.jpg">
            <source media="(min-width: 768px)" srcset="imagens/imagem-m.jpg">
            <img src="imagens/imagem-p.jpg" alt="Imagem de uma Linda Praia">
        </picture>
        <form action="cadastro.php" method="post" autocomplete="off">
            <legend><h1>Login</h1></legend>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <div class="fundo">
                <label for="email">
                    <span class="material-symbols-outlined">person</span>
                    <input type="email" name="email" id="email" placeholder="Seu e-mail"  required>
                </label>
            </div>
            <div class="fundo">
                <label for="senha">
                    <span class="material-symbols-outlined">vpn_key</span>
                    <input type="password" name="senha" id="senha" placeholder="Sua Senha" required>
                </label>
            </div>
            <div>
                <label for="entrar">
                    <p>Entrar</p>
                    <input type="submit" value="Entrar" id="entrar">
                </label>
            </div>
            <div>
                <label for="e-senha">
                    <p>Esqueci a Senha</p>
                    <input type="submit" value="Esqueci a Senha" id="e-senha">
                </label>
            </div>
        </form>
    </section>
</body>
</html>
