<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/768.css"  media="screen and (min-width: 768px) and (max-width: 991px)">
    <link rel="stylesheet" href="estilos/992.css" media="screen and (min-width: 992px)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person" />
</head>
<body>
    <section>
        <div id="img"></div>
        <form action="cadastro.php" method="post" autocomplete="off">
            <legend><h1>Login</h1></legend>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <div class="fundo">
                <label for="email">
                    <span class="material-symbols-outlined">person</span>
                    <input type="email" name="email" id="email" placeholder="   Seu e-mail"  required>
                </label>
            </div>
            <div class="fundo">
                <label for="senha">
                    <img src="imagens/vpn_key.svg" alt="Chave" class="key">
                    <input type="password" name="senha" id="senha" placeholder="    Sua Senha" required>
                </label>
            </div>
            <div class="botao">
                <label for="entrar">
                    <p style="color: white;">Entrar</p>
                    <input type="submit" value="Entrar" id="entrar">
                </label>
            </div>
            <div class="botao" id="botao2">
                <label for="e-senha">
                    <a href="e-senha.html"><p style="color: var(--marron-escuro);">Esqueci a Senha</p></a>
                </label>
            </div>
        </form>
    </section>
</body>
</html>
