<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
            text-align: center;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <!--
    Mesclagem de Células

        Usando *colspan="valor"* inline podemos expandir uma célula para ocupar mais colulas.
    HTML
        <table>
            <tr>
                <td>A</td>
                <td colspan="2">B</td>
            </tr>
        
        Nesse caso a linha B ocupa o espaço de 2 colunas.
        
        Usando *rowspan="valor"* inline podemos expandir uma célula para ocupar mais linhas.
    HTML
        <table>
            <tr>
                <td>D</td>
                <td>E</td>
                <td rowspan="3">F</td>
            </tr>
        -->
            
    <h1>Mesclagem de Células</h1>
    
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>
            <td>H</td>         
        </tr>
        <tr>
            <td colspan="2">L</td>            
        </tr>
    </table>
</body>
</html>
