<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            height: 200px;

            display: flex;
            flex-flow: column-reverse wrap-reverse;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de blopo A</div>
        <div class="item">Exemplo de blopo B</div>
        <div class="item">Exemplo de blopo C</div>
        <div class="item">Exemplo de blopo D</div>
        <div class="item">Exemplo de blopo E</div>
        <div class="item">Exemplo de blopo F</div>
        <div class="item">Exemplo de blopo G</div>
    </div>
</body>
</html>
