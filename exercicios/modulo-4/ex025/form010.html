<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <!--
        Forma em que fiz sozinho
        <p>
            <label for="iano">Em que ano você Nasceu? 
                <input type="number" name="ano" id="iano" min="1900" max="2020" value="2000" oninput="iidade.innerHTML = Number(2025) - Number(iano.value)" required>
            </label>
        </p>
        -->

        <p>
            <label for="iano">Em que ano você Nasceu? 
                <input type="number" name="ano" id="iano" min="1900" max="2020" value="2000" oninput="calcIdade()" required>
            </label>
        </p>

        <p>
            <label for="iidade">Sua idade é: 
                <output id="iidade">0</output>
            </label>
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcIdade () {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
