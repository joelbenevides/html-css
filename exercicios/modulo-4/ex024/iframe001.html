<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <!--Tamanho padrão de um iframe = 300x150-->
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do <a href="https://cursoemvideo.com" target="_blank">CursoemVídeo</a> para aprender a programar.</p>
    <iframe width="400px" height="400px" src="https://www.cursoemvideo.com" frameborder="0" scrolling="no"> <!--
        Parâmetro scrolling tem os valores:
            auto, yes e no-->
        <a href="https://cursoemvideo.com" target="_blank">CursoemVídeo</a>
    </iframe>

    <p>o site do <a href="https://www.google.com" target="_blank">Google</a> é muito legal, pena que não funciona dentro de um iframe.</p>
    <iframe src="https://www.google.com" frameborder="0"></iframe>
</body>
</html>
